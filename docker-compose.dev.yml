services:
  api:
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./models:/app/models
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"

  ui:
    volumes:
      - ./sprint-ui/dist:/usr/share/nginx/html
